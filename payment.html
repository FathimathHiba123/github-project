<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
</head>
<body>

    <h2>Secure Payment Checkout</h2>

    <!-- The form submits to your server processing script (e.g., process-payment.php) -->
    <form action="/process-payment" method="POST">
        
        <!-- Cardholder Name -->
        <div>
            <label for="card-name">Name on Card</label>
            <input 
                type="text" 
                id="card-name" 
                name="cardname" 
                placeholder="John Doe" 
                required 
                autocomplete="cc-name">
        </div>

        <!-- Card Number -->
        <div>
            <label for="card-number">Card Number</label>
            <input 
                type="tel" 
                id="card-number" 
                name="cardnumber" 
                placeholder="1234 5678 9101 1121" 
                required 
                inputmode="numeric"
                pattern="[0-9\s]{13,19}"
                maxlength="19"
                autocomplete="cc-number">
        </div>

        <!-- Expiration Date -->
        <div>
            <label for="card-expiry">Expiry Date</label>
            <input 
                type="tel" 
                id="card-expiry" 
                name="cardexpiry" 
                placeholder="MM/YY" 
                required 
                pattern="(0[1-9]|1[0-2])\/([0-9]{2})"
                maxlength="5"
                autocomplete="cc-exp">
        </div>

        <!-- Security Code (CVV) -->
        <div>
            <label for="card-cvc">Security Code (CVV)</label>
            <input 
                type="password" 
                id="card-cvc" 
                name="cardcvc" 
                placeholder="123" 
                required 
                inputmode="numeric"
                pattern="[0-9]{3,4}"
                maxlength="4"
                autocomplete="cc-csc">
        </div>

        <!-- Submit Button -->
        <div>
            <button type="submit">Pay Now</button>
        </div>

    </form>

</body>
</html>
