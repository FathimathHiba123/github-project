<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, y initial-scale=1.0">
    <title>My First Webpage</title>
</head>
<body>

    <!-- Main Title Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Subheading -->
    <h2>About This Page</h2>

    <!-- Text Paragraph -->
    <p>This is a simple paragraph of text. HTML allows you to easily structure content for the web.</p>

    <!-- Hyperlink pointing to an external website -->
    <p>Learn more at <a href="https://www.w3schools.com" target="_blank">W3Schools</a>.</p>

    <!-- Embedding an Image -->
    <img src="placeholder.jpg" alt="A descriptive placeholder image" width="300">

</body>
</html>
